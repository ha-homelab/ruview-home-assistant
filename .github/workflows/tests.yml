name: Offline contract tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install test and build dependencies
        run: |
          uv sync --frozen --extra dev
      - name: Validate source and behavior
        run: |
          uv run --frozen --extra dev sh scripts/check.sh
      - name: Build source and wheel distributions
        run: uv run --frozen --extra dev python -m build
  container:
    name: Container build and offline replay
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the documented image
        run: docker build --tag ruview-ci .
      - name: Check installed packages and production replay without a network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges ruview-ci --version
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python3 -i ruview-ci - <<'PY'
          import importlib.metadata
          import os
          import paho.mqtt.client
          import websockets
          from ruview_home_assistant.replay import replay, synthetic_frames
          assert os.getuid() == 10001
          assert importlib.metadata.version("pip") == "26.2.1"
          results = [replay(frame) for frame in synthetic_frames()]
          assert [item["occupancy_entity"] for item in results] == ["ON", "ON", "OFF", "unavailable", "unavailable"]
          assert all(item["synthetic"] for item in results)
          print("Installer, runtime imports and five production replay cases passed as UID 10001 without network access.")
          PY
      - name: Scan the actual image and retain its complete package inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ruview-ci
          format: json
          output: container-trivy.json
          scanners: vuln
          list-all-pkgs: true
          ignore-unfixed: false
          exit-code: '0'
      - name: Verify the native library fix and export the SBOM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("container-trivy.json").read_text())
          packages = [package for result in report["Results"] for package in result.get("Packages", [])]
          matches = [package for package in packages if package["Name"] == "liblzma5"]
          assert len(matches) == 1, "The scanner must identify the installed liblzma5"
          assert matches[0]["Version"] == "5.8.1"
          assert matches[0]["Release"] == "1+deb13u2"
          findings = {finding["VulnerabilityID"] for result in report["Results"] for finding in result.get("Vulnerabilities", [])}
          assert not findings.intersection({"DSA-6549-1", "TEMP-1147318-639065", "GHSA-5qpq-xqfv-j9pg"})
          print("Verified the exact patched liblzma5 package and absence of the XZ advisory; all other findings remain in the report.")
          PY
          trivy convert --format cyclonedx --output container-sbom.cdx.json container-trivy.json
      - name: Upload image inventory and vulnerability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-evidence
          path: |
            container-trivy.json
            container-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
