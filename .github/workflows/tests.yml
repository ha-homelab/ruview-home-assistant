name: Offline contract tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install test and build dependencies
        run: |
          uv sync --frozen --extra dev
      - name: Validate source and behavior
        run: |
          uv run --frozen --extra dev sh scripts/check.sh
      - name: Build source and wheel distributions
        run: uv run --frozen --extra dev python -m build
  container:
    name: Container build and offline replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the documented image
        run: docker build --tag ruview-ci .
      - name: Check installed packages and production replay without a network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges ruview-ci --version
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python3 -i ruview-ci - <<'PY'
          import importlib.metadata
          import os
          import paho.mqtt.client
          import websockets
          from ruview_home_assistant.replay import replay, synthetic_frames
          assert os.getuid() == 10001
          assert importlib.metadata.version("pip") == "26.2.1"
          results = [replay(frame) for frame in synthetic_frames()]
          assert [item["occupancy_entity"] for item in results] == ["ON", "ON", "OFF", "unavailable", "unavailable"]
          assert all(item["synthetic"] for item in results)
          print("Installer, runtime imports and five production replay cases passed as UID 10001 without network access.")
          PY
