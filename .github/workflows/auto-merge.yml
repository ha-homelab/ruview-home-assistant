# Read authoritative GitHub metadata only; never execute PR code with BOT_PAT.
name: Auto Merge PRs
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  workflow_run:
    workflows: [Quality gate, Auto Approve PRs]
    types: [completed]
  status:
  check_run:
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
jobs:
  auto-merge:
    # Trusted default-branch metadata events; never execute the PR workflow.
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) ||
      (contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    concurrency:
      group: automerge-reviewed-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@77b0157695fb80e4d97c3ac4819c2d1db7ba96c7 # main
    with:
      runner-labels: '["ubuntu-24.04"]'
      # Include the existing owned Renovate account in reviewed merges.
      pr-author: 4alvit,californiantiramisu,dependabot[bot],renovate[bot]
      merge-method: squash
      reviewed-merge: true
      reviewed-single-pass: true
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
      required-status-checks: CI gate
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
